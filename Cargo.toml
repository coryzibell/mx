[package]
name = "mx"
version = "0.1.208"
edition = "2024"
description = "A Swiss army knife for Claude Code and multi-agent toolkits"
authors = ["Cory Zibell <cory@zibell.cloud>"]
license = "Apache-2.0"
repository = "https://github.com/coryzibell/mx"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# SurrealDB
surrealdb = { version = "2", features = ["kv-surrealkv", "protocol-ws", "rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

# Error handling
anyhow = "1"
thiserror = "2"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Paths
dirs = "6"

# Random
rand = "0.9"

# UUID generation
uuid = { version = "1", features = ["v4"] }

# Cryptography for wake token signing
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"

# base-d library (includes compression support)
base-d = "3"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
regex = "1.12.2"

# JWT for GitHub App auth
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
pem = "3"
lazy_static = "1"

# Temporary directories
tempfile = "3"

# CommonMark parser (fence-aware heading extraction — mx#215)
pulldown-cmark = { version = "0.13", default-features = false }

# Triggered memories (Issue #246, PR3): stemming + Unicode canonicalization +
# cross-process file locking for session-scoped fired-state.
rust-stemmers = "1"
unicode-normalization = "0.1"
fs2 = "0.4"

# Terminal colors
colored = "2"

# Embeddings (pure-Rust via tract-onnx, no C++ ONNX Runtime)
tract-onnx = "0.22"
tokenizers = { version = "0.21", default-features = false, features = ["progressbar", "fancy-regex"] }
hf-hub = { version = "0.4", default-features = false, features = ["ureq"] }

[build-dependencies]
base-d = "3"

[dev-dependencies.cargo-husky]
version = "1"
default-features = false
features = ["user-hooks"]

[dev-dependencies]
serial_test = "3"
proptest = "1"

[[bin]]
name = "mx"
path = "src/main.rs"

# DO NOT REMOVE: tract upstream cannot build aarch64-pc-windows-msvc — cl.exe
# silently ignores the GAS-syntax .S SIMD kernels and lib.exe fails with
# LNK1181. The fork branch carries the fix (clang override + masm gate,
# linalg/build.rs). Removing this section kills the arm64-windows release leg
# (proven: PR #395 removed it, v0.1.207 release failed; restored in #394).
# The fork branch must be rebased when bumping tract; old revs are preserved
# as patch-* tags. A "patch was not used" warning means the fork version no
# longer matches resolution — fix the mismatch, do not delete the patch.
[patch.crates-io]
tract-linalg = { git = "https://github.com/coryzibell/tract.git", branch = "fix/aarch64-msvc-asm" }
tract-data = { git = "https://github.com/coryzibell/tract.git", branch = "fix/aarch64-msvc-asm" }


