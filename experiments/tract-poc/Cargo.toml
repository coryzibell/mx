[package]
name = "tract-poc"
version = "0.1.0"
edition = "2021"

[dependencies]
tract-onnx = "0.22"
tokenizers = "0.21"
ndarray = "0.16"
anyhow = "1"
fastembed = { version = "5.6", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"], optional = true }

[[bin]]
name = "tract-poc"
path = "src/main.rs"

[[bin]]
name = "fastembed-reference"
path = "src/fastembed_ref.rs"
required-features = ["fastembed"]
