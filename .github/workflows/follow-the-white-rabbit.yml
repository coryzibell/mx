# follow the white rabbit.
name: follow the white rabbit.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    uses: coryzibell/nebuchadnezzar/.github/workflows/follow-the-white-rabbit.yml@v1
    with:
      needs-openssl: false
      # All previous exclusions were due to ort/ONNX Runtime C++ linking issues.
      # With tract-onnx (pure Rust), all targets should build natively.
      exclude-targets: ""
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
