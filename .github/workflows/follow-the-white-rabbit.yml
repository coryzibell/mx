# follow the white rabbit.
name: follow the white rabbit.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    uses: coryzibell/nebuchadnezzar/.github/workflows/follow-the-white-rabbit.yml@v1
    with:
      needs-openssl: false
      # aarch64-pc-windows-msvc: tract-linalg ARM64 SIMD assembly fails with MSVC linker
      exclude-targets: aarch64-pc-windows-msvc
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
